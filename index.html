
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--top:44px;--bot:32px;--panel:240px}
body{font-family:var(--font-sans);background:transparent}

/* ── Layout shell ── */
#app{display:flex;flex-direction:column;height:620px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;flex-shrink:0}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:var(--panel);flex-shrink:0;display:flex;flex-direction:column;border-right:0.5px solid var(--color-border-tertiary);overflow:hidden}
#canvas-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
#canvas-area{flex:1;position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
#bottombar{padding:4px 10px;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-secondary);flex-shrink:0}

/* ── Sidebar internals ── */
#search-wrap{padding:8px;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
#search-box{width:100%;padding:6px 10px 6px 32px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;outline:none}
#search-box:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
#search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--color-text-tertiary);pointer-events:none}
#def-scroll{flex:1;overflow-y:auto;padding:6px}
#ann-section{border-top:0.5px solid var(--color-border-tertiary);padding:6px;flex-shrink:0;max-height:160px;overflow-y:auto}
.sec-lbl{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.5px;padding:2px 2px 4px}

/* Defect items */
.def-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border:0.5px solid transparent;border-radius:6px;cursor:pointer;transition:all 0.1s;margin-bottom:2px}
.def-item:hover{background:var(--color-background-secondary);border-color:var(--color-border-tertiary)}
.def-item.sel{background:#E6F1FB;border-color:#378ADD}
.def-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.def-text{flex:1;min-width:0}
.def-km{font-size:11.5px;color:var(--color-text-primary);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.def-zh{font-size:10px;color:var(--color-text-tertiary)}
.def-item.sel .def-km{color:#0C447C;font-weight:500}
.def-item.sel .def-zh{color:#185FA5}
.no-result{font-size:12px;color:var(--color-text-tertiary);text-align:center;padding:16px 8px}

/* Log items */
.log-item{display:flex;align-items:flex-start;gap:5px;padding:4px 5px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;margin-bottom:3px}
.log-num{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:#fff;flex-shrink:0;margin-top:1px}
.log-lbl{flex:1;font-size:11px;line-height:1.3;color:var(--color-text-primary)}
.log-zh{font-size:9.5px;color:var(--color-text-secondary)}
.log-del{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:12px;padding:0 2px;border-radius:3px;flex-shrink:0}
.log-del:hover{color:#E24B4A}

/* Canvas */
#bg-img{object-fit:contain;pointer-events:none;user-select:none;display:none;position:absolute}
#ann-canvas{position:absolute;cursor:crosshair}
#hint{color:#888;font-size:13px;text-align:center;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
#hint i{font-size:36px;color:#555}

/* Toolbar buttons */
.tb-btn{display:flex;align-items:center;gap:4px;padding:5px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.1s;flex-shrink:0}
.tb-btn:hover{background:var(--color-background-secondary)}
.tb-btn.on{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.tb-btn i{font-size:14px}
.tb-sep{width:0.5px;height:22px;background:var(--color-border-tertiary);flex-shrink:0}
.kbd{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:3px;padding:0 3px;font-size:9px;font-family:var(--font-mono)}
#color-pick{width:26px;height:26px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:1px;cursor:pointer;background:none;flex-shrink:0}
#size-range{width:55px;accent-color:#378ADD;flex-shrink:0}
label[for=file-in]{cursor:pointer}
#file-in{display:none}

/* Mobile panel toggle */
#panel-toggle{display:none}
#mob-panel{display:none}

/* ── MOBILE ≤600px ── */
@media(max-width:600px){
  :root{--panel:100%}
  #app{height:100vh;height:100dvh;border:none;border-radius:0}
  #topbar{padding:5px 8px;gap:4px}
  .tb-btn{padding:5px 7px;font-size:11px}
  .kbd{display:none}
  #main{flex-direction:column}
  #sidebar{display:none;width:100%;border-right:none;border-top:0.5px solid var(--color-border-tertiary);max-height:55vh}
  #sidebar.open{display:flex}
  #canvas-col{flex:1;min-height:0}
  #panel-toggle{display:flex;align-items:center;gap:4px;padding:5px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;font-size:12px;font-weight:500}
  #panel-toggle.on{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
}
/* highlight match */
.hl{background:#FFF3CC;border-radius:2px;font-weight:600}
</style>

<div id="app">
<h2 class="sr-only">ឧបករណ៍គូសសញ្ញាបញ្ហាផ្សា</h2>

<!-- TOP BAR -->
<div id="topbar">
  <label for="file-in" class="tb-btn"><i class="ti ti-photo-up" aria-hidden="true"></i><span>ចូលរូបភាព</span></label>
  <input type="file" id="file-in" accept="image/*">
  <button id="panel-toggle" class="tb-btn"><i class="ti ti-list-search" aria-hidden="true"></i>ប្រភេទ</button>
  <div class="tb-sep"></div>
  <button class="tb-btn on" id="btn-c"><i class="ti ti-circle" aria-hidden="true"></i>រង្វង់<span class="kbd">C</span></button>
  <button class="tb-btn" id="btn-a"><i class="ti ti-arrow-up-right" aria-hidden="true"></i>ព្រួញ<span class="kbd">A</span></button>
  <button class="tb-btn" id="btn-t"><i class="ti ti-text-size" aria-hidden="true"></i>អក្សរ<span class="kbd">T</span></button>
  <div class="tb-sep"></div>
  <input type="color" id="color-pick" value="#FF2222" title="ពណ៌">
  <input type="range" id="size-range" min="1" max="6" value="2.5" step="0.5" title="ទំហំខ្សែ">
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-u"><i class="ti ti-arrow-back-up" aria-hidden="true"></i>Undo<span class="kbd">Z</span></button>
  <button class="tb-btn" id="btn-clr"><i class="ti ti-trash" aria-hidden="true"></i></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-save" style="background:#EAF3DE;border-color:#3B6D11;color:#27500A"><i class="ti ti-download" aria-hidden="true"></i>រក្សាទុក</button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="search-wrap" style="position:relative">
      <i class="ti ti-search" id="search-icon" aria-hidden="true"></i>
      <input type="text" id="search-box" placeholder="វាយស្វែងរកប្រភេទបញ្ហា..." autocomplete="off" spellcheck="false">
    </div>
    <div id="def-scroll">
      <div class="sec-lbl">ប្រភេទបញ្ហាទាំងអស់</div>
      <div id="def-list"></div>
    </div>
    <div id="ann-section">
      <div class="sec-lbl">ការគូសសញ្ញា</div>
      <div id="ann-log"><span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span></div>
    </div>
  </div>

  <!-- CANVAS COLUMN -->
  <div id="canvas-col">
    <div id="canvas-area">
      <div id="hint"><i class="ti ti-photo-plus" aria-hidden="true"></i><span>ចុច «ចូលរូបភាព» ឬ Paste Ctrl+V</span></div>
      <img id="bg-img" alt="រូបភាព">
      <canvas id="ann-canvas"></canvas>
    </div>
    <div id="bottombar">
      <i class="ti ti-info-circle" aria-hidden="true"></i>
      <span id="status">ជ្រើសប្រភេទបញ្ហា រួចគូសសញ្ញា</span>
      <span style="margin-left:auto" id="coord"></span>
    </div>
  </div>

</div><!-- /main -->
</div><!-- /app -->

<script>
const DEFECTS = [
  {zh:'開裂',km:'ផ្សាប្រេះសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊破',km:'ផ្សាធ្លុះសាច់បំពង់',c:'#E24B4A'},
  {zh:'漏焊',km:'ភ្លេចថ្នេរផ្សា',c:'#BA7517'},
  {zh:'针眼',km:'ភ្នែកម្ជុល',c:'#BA7517'},
  {zh:'凹陷',km:'ស្នាមផត',c:'#BA7517'},
  {zh:'管料搭接偏心',km:'មុខតំណរផ្សាភ្ជាប់មិនស្របគ្នា',c:'#534AB7'},
  {zh:'鱼眼/熔坑',km:'ភ្នែកត្រី',c:'#BA7517'},
  {zh:'电击伤',km:'ផ្សាឆេះម៉ាស់',c:'#E24B4A'},
  {zh:'焊道偏心',km:'ផ្សាខុសវៀច',c:'#534AB7'},
  {zh:'起止点不良',km:'ចំណុចផ្តើម-បញ្ចប់មិនស្តង់ដា',c:'#BA7517'},
  {zh:'宽窄不一',km:'ទំហំថ្នេរផ្សាខុសគ្នា',c:'#534AB7'},
  {zh:'鱼鳞片间隙',km:'គម្លាតស្រកាត្រី',c:'#185FA5'},
  {zh:'鱼鳞片宽度',km:'ទំហំស្រកាត្រី',c:'#185FA5'},
  {zh:'堆焊',km:'ប៉ោងខ្ពស់ពេក',c:'#0F6E56'},
  {zh:'咬边',km:'ផ្សាស៊ីសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊道重叠',km:'ស្រកាត្រីត្រួតលើគ្នា',c:'#534AB7'},
  {zh:'填充不足',km:'ផ្សាអត់ដល់គ្នា',c:'#0F6E56'},
  {zh:'碰刮伤',km:'ស្នាមដាច់សាច់បំពង់',c:'#E24B4A'},
  {zh:'焊渣',km:'ផ្សាបែកទឹកអន្សា',c:'#BA7517'},
];

/* ── DOM refs ── */
const defListEl=document.getElementById('def-list');
const annLogEl=document.getElementById('ann-log');
const bgImg=document.getElementById('bg-img');
const canvas=document.getElementById('ann-canvas');
const ctx=canvas.getContext('2d');
const hint=document.getElementById('hint');
const statusEl=document.getElementById('status');
const coordEl=document.getElementById('coord');
const colorPick=document.getElementById('color-pick');
const sizeRange=document.getElementById('size-range');
const searchBox=document.getElementById('search-box');
const sidebar=document.getElementById('sidebar');
const panelToggle=document.getElementById('panel-toggle');

let mode='circle', selectedDef=null, annotations=[], drawing=false;
let startX,startY,imgLoaded=false;

/* ── Mobile panel toggle ── */
panelToggle.addEventListener('click',()=>{
  sidebar.classList.toggle('open');
  panelToggle.classList.toggle('on');
});

/* ── Search & filter ── */
function normalize(s){return s.toLowerCase().replace(/\s/g,'');}
function highlight(text,q){
  if(!q) return text;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<span class="hl">$1</span>');
}
function scoreMatch(d,q){
  const nq=normalize(q);
  const nkm=normalize(d.km), nzh=normalize(d.zh);
  if(nkm.includes(nq)||nzh.includes(nq)) return 2;
  // fuzzy: all chars in order
  let ki=0,zi=0;
  for(const ch of nq){ ki=nkm.indexOf(ch,ki)+1; zi=nzh.indexOf(ch,zi)+1; }
  if(ki>0||zi>0) return 1;
  return 0;
}

function renderDefects(q){
  defListEl.innerHTML='';
  const scored = DEFECTS.map((d,i)=>({d,i,s:q?scoreMatch(d,q):2})).filter(x=>x.s>0);
  if(!scored.length){
    defListEl.innerHTML='<div class="no-result"><i class="ti ti-search-off"></i><br>រកមិនឃើញ</div>'; return;
  }
  scored.forEach(({d,i})=>{
    const el=document.createElement('div');
    el.className='def-item'+(selectedDef===d?' sel':'');
    el.dataset.idx=i;
    const kmH=q?highlight(d.km,q):d.km;
    const zhH=q?highlight(d.zh,q):d.zh;
    el.innerHTML=`<div class="def-dot" style="background:${d.c}"></div><div class="def-text"><span class="def-km">${kmH}</span><span class="def-zh">${zhH}</span></div>`;
    el.addEventListener('click',()=>selectDef(d,el));
    defListEl.appendChild(el);
  });
}

function selectDef(d, elClicked){
  selectedDef=d;
  colorPick.value=d.c;
  document.querySelectorAll('.def-item').forEach(b=>b.classList.remove('sel'));
  if(elClicked) elClicked.classList.add('sel');
  statusEl.textContent=`ជ្រើស: ${d.km} · ${d.zh}`;
  // mobile: close panel after selection
  if(window.innerWidth<=600){ sidebar.classList.remove('open'); panelToggle.classList.remove('on'); }
}

searchBox.addEventListener('input',()=>{
  const q=searchBox.value.trim();
  renderDefects(q);
});

// keyboard nav in search
searchBox.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=defListEl.querySelector('.def-item');
    if(first){ const i=parseInt(first.dataset.idx); selectDef(DEFECTS[i],first); searchBox.value=''; renderDefects(''); }
  }
  if(e.key==='Escape'){ searchBox.value=''; renderDefects(''); searchBox.blur(); }
});

renderDefects('');

/* ── Tool mode ── */
const btnC=document.getElementById('btn-c');
const btnA=document.getElementById('btn-a');
const btnT=document.getElementById('btn-t');
function setMode(m){
  mode=m;
  btnC.classList.toggle('on',m==='circle');
  btnA.classList.toggle('on',m==='arrow');
  btnT.classList.toggle('on',m==='text');
  canvas.style.cursor=m==='text'?'text':'crosshair';
}
btnC.addEventListener('click',()=>setMode('circle'));
btnA.addEventListener('click',()=>setMode('arrow'));
btnT.addEventListener('click',()=>setMode('text'));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='c'||e.key==='C') setMode('circle');
  if(e.key==='a'||e.key==='A') setMode('arrow');
  if(e.key==='t'||e.key==='T') setMode('text');
  if(e.key==='z'||e.key==='Z') undoLast();
});
document.getElementById('btn-u').addEventListener('click',undoLast);
document.getElementById('btn-clr').addEventListener('click',()=>{
  annotations=[];redraw();
  annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';
});

/* ── Image load ── */
document.getElementById('file-in').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadImg(f);});
document.addEventListener('paste',e=>{
  for(const it of(e.clipboardData?.items||[])){if(it.type.startsWith('image/')){loadImg(it.getAsFile());break;}}
});
function loadImg(file){
  const url=URL.createObjectURL(file);
  bgImg.src=url; bgImg.style.display='block'; hint.style.display='none';
  bgImg.onload=()=>{imgLoaded=true;annotations=[];annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';resizeCanvas();};
}
function resizeCanvas(){
  if(!imgLoaded)return;
  const area=document.getElementById('canvas-area');
  const aW=area.clientWidth,aH=area.clientHeight;
  const sc=Math.min(aW/bgImg.naturalWidth,aH/bgImg.naturalHeight,1);
  const dW=Math.round(bgImg.naturalWidth*sc),dH=Math.round(bgImg.naturalHeight*sc);
  const ox=Math.round((aW-dW)/2),oy=Math.round((aH-dH)/2);
  bgImg.style.cssText=`display:block;position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;transform:none`;
  canvas.width=dW;canvas.height=dH;
  canvas.style.cssText=`position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;cursor:${mode==='text'?'text':'crosshair'}`;
  redraw();
}
window.addEventListener('resize',()=>{if(imgLoaded)resizeCanvas();});

/* ── Canvas events ── */
function getPos(e){
  const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
  return{x:s.clientX-r.left,y:s.clientY-r.top};
}
canvas.addEventListener('mousemove',e=>{
  const p=getPos(e);
  coordEl.textContent=`${Math.round(p.x)}, ${Math.round(p.y)}`;
  if(drawing){redraw();drawPreview(startX,startY,p.x,p.y);}
});
canvas.addEventListener('mouseleave',()=>{coordEl.textContent='';});
canvas.addEventListener('mousedown',e=>{
  if(!imgLoaded)return;
  if(mode==='text'){doText(getPos(e));return;}
  drawing=true;const p=getPos(e);startX=p.x;startY=p.y;
});
canvas.addEventListener('mouseup',e=>{
  if(!drawing)return;drawing=false;
  const p=getPos(e);
  if(Math.abs(p.x-startX)<4&&Math.abs(p.y-startY)<4)return;
  pushAnn(mode,startX,startY,p.x,p.y);
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!imgLoaded||mode==='text')return;drawing=true;const p=getPos(e);startX=p.x;startY=p.y;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);redraw();drawPreview(startX,startY,p.x,p.y);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(!drawing)return;drawing=false;const t=e.changedTouches[0],r=canvas.getBoundingClientRect();pushAnn(mode,startX,startY,t.clientX-r.left,t.clientY-r.top);},{passive:false});

function doText(p){
  if(!selectedDef){statusEl.textContent='⚠ ជ្រើសប្រភេទបញ្ហាជាមុន!';return;}
  pushAnn('text',p.x,p.y,p.x,p.y);
}
function pushAnn(m,x1,y1,x2,y2){
  if(!selectedDef){statusEl.textContent='⚠ ជ្រើសប្រភេទបញ្ហាជាមុន!';return;}
  const ann={mode:m,x1,y1,x2,y2,color:colorPick.value,km:selectedDef.km,zh:selectedDef.zh,n:annotations.length+1};
  annotations.push(ann);redraw();addLogItem(ann);
}

/* ── Drawing ── */
function drawArrow(c,x1,y1,x2,y2,lw){
  const ang=Math.atan2(y2-y1,x2-x1),hL=Math.max(14,lw*5);
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-hL*Math.cos(ang-0.38),y2-hL*Math.sin(ang-0.38));
  c.lineTo(x2-hL*Math.cos(ang+0.38),y2-hL*Math.sin(ang+0.38));
  c.closePath();c.fill();
}
function drawEllipse(c,x1,y1,x2,y2){
  c.beginPath();c.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(Math.abs(x2-x1)/2,2),Math.max(Math.abs(y2-y1)/2,2),0,0,Math.PI*2);c.stroke();
}
function badgeXY(ann){
  if(ann.mode==='circle')return{x:(ann.x1+ann.x2)/2,y:Math.min(ann.y1,ann.y2)};
  return{x:ann.x2,y:ann.y2};
}
function drawLabel(c,ann,s){
  s=s||1;
  const fsKm=Math.round(12*s),fsZh=Math.round(11*s),pad=5*s,gap=3*s,br=9*s;
  const {x:bx,y:by}=badgeXY(ann);
  c.save();
  c.font=`bold ${fsKm}px sans-serif`;const wKm=c.measureText(ann.km).width;
  c.font=`${fsZh}px sans-serif`;const wZh=c.measureText(ann.zh).width;
  const boxW=Math.max(wKm,wZh)+pad*2,boxH=fsKm+gap+fsZh+pad*2;
  const lbx=bx+br+4*s,lby=by-boxH/2;
  c.fillStyle='rgba(0,0,0,0.75)';
  c.beginPath();
  if(c.roundRect)c.roundRect(lbx-pad,lby,boxW,boxH,4*s);else c.rect(lbx-pad,lby,boxW,boxH);
  c.fill();
  // badge
  c.fillStyle=ann.color;c.beginPath();c.arc(bx,by,br,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.font=`bold ${Math.round(9*s)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ann.n,bx,by);
  // km
  c.font=`bold ${fsKm}px sans-serif`;c.textAlign='left';c.textBaseline='top';c.fillStyle='#fff';c.fillText(ann.km,lbx,lby+pad);
  // zh
  c.font=`${fsZh}px sans-serif`;c.fillStyle='#ffd966';c.fillText(ann.zh,lbx,lby+pad+fsKm+gap);
  c.restore();
}
function drawCallout(c,ann,s){
  s=s||1;const lw=parseFloat(sizeRange.value)*s;
  c.save();c.strokeStyle=ann.color;c.fillStyle=ann.color;c.lineWidth=lw;
  if(ann.mode==='circle')drawEllipse(c,ann.x1,ann.y1,ann.x2,ann.y2);
  else if(ann.mode==='arrow')drawArrow(c,ann.x1,ann.y1,ann.x2,ann.y2,lw);
  c.restore();
  drawLabel(c,ann,s);
}
function drawPreview(x1,y1,x2,y2){
  const lw=parseFloat(sizeRange.value);
  ctx.save();ctx.globalAlpha=.6;ctx.strokeStyle=colorPick.value;ctx.fillStyle=colorPick.value;ctx.lineWidth=lw;
  if(mode==='circle')drawEllipse(ctx,x1,y1,x2,y2);
  else if(mode==='arrow')drawArrow(ctx,x1,y1,x2,y2,lw);
  ctx.restore();
}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);annotations.forEach(a=>drawCallout(ctx,a,1));}

/* ── Log ── */
function addLogItem(ann){
  const old=annLogEl.querySelector('span');if(old)old.remove();
  const item=document.createElement('div');item.className='log-item';item.dataset.n=ann.n;
  item.innerHTML=`<div class="log-num" style="background:${ann.color}">${ann.n}</div><div class="log-lbl">${ann.km}<br><span class="log-zh">${ann.zh}</span></div><button class="log-del" aria-label="លុប">✕</button>`;
  item.querySelector('.log-del').addEventListener('click',()=>{
    annotations=annotations.filter(a=>a.n!==ann.n);item.remove();redraw();
    if(!annotations.length)annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';
  });
  annLogEl.appendChild(item);annLogEl.scrollTop=annLogEl.scrollHeight;
}
function undoLast(){
  if(!annotations.length)return;
  const last=annotations.pop();
  const el=annLogEl.querySelector(`[data-n="${last.n}"]`);if(el)el.remove();
  redraw();
  if(!annotations.length)annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';
}

/* ── Save ── */
document.getElementById('btn-save').addEventListener('click',()=>{
  if(!imgLoaded)return;
  const out=document.createElement('canvas');
  out.width=bgImg.naturalWidth;out.height=bgImg.naturalHeight;
  const oc=out.getContext('2d');oc.drawImage(bgImg,0,0);
  const sx=bgImg.naturalWidth/canvas.width;
  annotations.forEach(ann=>{
    const sc={...ann,x1:ann.x1*sx,y1:ann.y1*sx,x2:ann.x2*sx,y2:ann.y2*sx};
    drawCallout(oc,sc,sx);
  });
  const a=document.createElement('a');a.download='defect_report.png';a.href=out.toDataURL('image/png');a.click();
});
</script>
