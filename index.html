
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--r:14px;--mob-nav:72px;--mob-top:56px}
body{font-family:var(--font-sans)}

/* ══ SHELL ══ */
#app{display:flex;flex-direction:column;height:640px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);position:relative}

/* ══ DESKTOP ══ */
#desk-top{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;flex-shrink:0}
#desk-main{display:flex;flex:1;overflow:hidden}
#desk-side{width:230px;flex-shrink:0;display:flex;flex-direction:column;border-right:0.5px solid var(--color-border-tertiary);overflow:hidden}
#desk-search-wrap{padding:8px;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0;position:relative}
#desk-search{width:100%;padding:7px 10px 7px 32px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;outline:none}
#desk-search:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
#desk-si{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--color-text-tertiary);pointer-events:none}
#desk-def-scroll{flex:1;overflow-y:auto;padding:6px}
#desk-ann{border-top:0.5px solid var(--color-border-tertiary);padding:6px;max-height:150px;overflow-y:auto;flex-shrink:0}
#canvas-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
#canvas-area{flex:1;position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
#desk-bot{padding:4px 10px;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-secondary);flex-shrink:0}
.tb-btn{display:flex;align-items:center;gap:4px;padding:5px 9px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .1s;flex-shrink:0}
.tb-btn:hover{background:var(--color-background-secondary)}
.tb-btn.on{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.tb-btn i{font-size:14px}
.tb-sep{width:0.5px;height:22px;background:var(--color-border-tertiary);flex-shrink:0}
.kbd{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:3px;padding:0 3px;font-size:9px;font-family:var(--font-mono)}
#desk-color{width:26px;height:26px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:1px;cursor:pointer;background:none;flex-shrink:0}
#desk-size{width:55px;accent-color:#378ADD;flex-shrink:0}
label[for=file-in]{cursor:pointer}
#file-in{display:none}
.sec-lbl{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.5px;padding:2px 2px 4px}
.def-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border:0.5px solid transparent;border-radius:6px;cursor:pointer;transition:all .1s;margin-bottom:2px}
.def-item:hover{background:var(--color-background-secondary);border-color:var(--color-border-tertiary)}
.def-item.sel{background:#E6F1FB;border-color:#378ADD}
.def-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.def-km{font-size:11.5px;color:var(--color-text-primary);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.def-zh{font-size:10px;color:var(--color-text-tertiary)}
.def-item.sel .def-km{color:#0C447C;font-weight:500}
.def-item.sel .def-zh{color:#185FA5}
.no-res{font-size:12px;color:var(--color-text-tertiary);text-align:center;padding:14px 6px}
.log-item{display:flex;align-items:flex-start;gap:5px;padding:4px 5px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;margin-bottom:3px}
.log-num{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:#fff;flex-shrink:0;margin-top:1px}
.log-lbl{flex:1;font-size:11px;line-height:1.3;color:var(--color-text-primary)}
.log-zh{font-size:9.5px;color:var(--color-text-secondary)}
.log-del{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:12px;padding:0 2px;border-radius:3px;flex-shrink:0}
.log-del:hover{color:#E24B4A}
#bg-img{object-fit:contain;pointer-events:none;user-select:none;display:none;position:absolute}
#ann-canvas{position:absolute;cursor:crosshair}
#hint{color:#888;font-size:13px;text-align:center;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
#hint i{font-size:36px;color:#555}

/* ══ MOBILE ONLY ══ */
#mob-top{display:none}
#mob-nav{display:none}
#mob-sheet-overlay{display:none}
#mob-sheet{display:none}

@media(max-width:640px){
  #app{height:100vh;height:100dvh;border:none;border-radius:0}
  #desk-top,#desk-side{display:none!important}
  #desk-bot{display:none!important}
  #desk-main{flex:1;overflow:hidden}
  #canvas-col{flex:1}

  /* mobile top bar */
  #mob-top{display:flex;align-items:center;gap:8px;padding:0 12px;height:var(--mob-top);background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0;z-index:10}
  #mob-logo{font-size:13px;font-weight:500;color:var(--color-text-primary);flex:1}
  #mob-sel-badge{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:20px;font-size:11px;color:var(--color-text-secondary);cursor:pointer;max-width:170px;overflow:hidden}
  #mob-sel-badge.active{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
  #mob-sel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#ccc}
  #mob-sel-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
  #mob-upload{width:38px;height:38px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  #mob-upload i{font-size:18px;color:var(--color-text-secondary)}
  #mob-save{width:38px;height:38px;border-radius:50%;border:none;background:#3B6D11;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  #mob-save i{font-size:18px;color:#fff}

  /* mobile bottom nav */
  #mob-nav{display:flex;align-items:stretch;height:var(--mob-nav);background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary);padding:8px 6px;gap:5px;flex-shrink:0}
  .mnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0.5px solid var(--color-border-secondary);border-radius:12px;background:var(--color-background-primary);cursor:pointer;transition:all .15s;padding:6px 2px;min-width:0}
  .mnav-btn i{font-size:22px;color:var(--color-text-secondary)}
  .mnav-btn span{font-size:10px;color:var(--color-text-secondary);white-space:nowrap}
  .mnav-btn.on{background:#E6F1FB;border-color:#378ADD}
  .mnav-btn.on i,.mnav-btn.on span{color:#0C447C}
  .mnav-btn.danger{background:#FCEBEB;border-color:#F09595}
  .mnav-btn.danger i,.mnav-btn.danger span{color:#A32D2D}
  .mnav-btn.success{background:#EAF3DE;border-color:#97C459}
  .mnav-btn.success i,.mnav-btn.success span{color:#27500A}
  #mob-color-btn{position:relative}
  #mob-color-inp{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

  /* bottom sheet */
  #mob-sheet-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;pointer-events:none;transition:background .25s}
  #mob-sheet-overlay.vis{background:rgba(0,0,0,.45);pointer-events:all}
  #mob-sheet{display:flex;flex-direction:column;position:fixed;bottom:0;left:0;right:0;height:72vh;background:var(--color-background-primary);border-radius:20px 20px 0 0;z-index:101;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  #mob-sheet.open{transform:translateY(0)}
  #sheet-handle{width:36px;height:4px;background:var(--color-border-secondary);border-radius:2px;margin:10px auto 0}
  #sheet-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;flex-shrink:0}
  #sheet-head h3{font-size:14px;font-weight:500;color:var(--color-text-primary);flex:1}
  #sheet-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--color-text-secondary);line-height:1;padding:4px}
  #mob-search-wrap{padding:0 12px 10px;flex-shrink:0;position:relative}
  #mob-search{width:100%;padding:10px 14px 10px 38px;border:0.5px solid var(--color-border-secondary);border-radius:12px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:14px;outline:none}
  #mob-search:focus{border-color:#378ADD;box-shadow:0 0 0 3px rgba(55,138,221,.15)}
  #mob-si{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--color-text-tertiary);pointer-events:none}
  #sheet-list{flex:1;overflow-y:auto;padding:4px 10px 16px}
  .sdef-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0.5px solid transparent;border-radius:12px;cursor:pointer;transition:all .12s;margin-bottom:4px}
  .sdef-item:active{transform:scale(.98)}
  .sdef-item:hover{background:var(--color-background-secondary);border-color:var(--color-border-tertiary)}
  .sdef-item.sel{background:#E6F1FB;border-color:#378ADD}
  .sdef-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .sdef-km{font-size:14px;color:var(--color-text-primary);display:block;font-weight:500}
  .sdef-zh{font-size:12px;color:var(--color-text-secondary)}
  .sdef-item.sel .sdef-km{color:#0C447C}
  .sdef-item.sel .sdef-zh{color:#185FA5}
  .hl{background:#FFF3CC;border-radius:2px;font-weight:600}
  /* hide desktop canvas controls on mobile */
  #mob-size-wrap{display:none}
}
@media(min-width:641px){
  #mob-top,#mob-nav,#mob-sheet,#mob-sheet-overlay{display:none!important}
}
</style>

<!-- MOBILE TOP -->
<div id="app">

<script>
const DEFECTS=[
  {zh:'開裂',km:'ផ្សាប្រេះសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊破',km:'ផ្សាធ្លុះសាច់បំពង់',c:'#E24B4A'},
  {zh:'漏焊',km:'ភ្លេចថ្នេរផ្សា',c:'#BA7517'},
  {zh:'针眼',km:'ភ្នែកម្ជុល',c:'#BA7517'},
  {zh:'凹陷',km:'ស្នាមផត',c:'#BA7517'},
  {zh:'管料搭接偏心',km:'មុខតំណរផ្សាភ្ជាប់មិនស្របគ្នា',c:'#534AB7'},
  {zh:'鱼眼/熔坑',km:'ភ្នែកត្រី',c:'#BA7517'},
  {zh:'电击伤',km:'ផ្សាឆេះម៉ាស់',c:'#E24B4A'},
  {zh:'焊道偏心',km:'ផ្សាខុសវៀច',c:'#534AB7'},
  {zh:'起止点不良',km:'ចំណុចផ្តើម-បញ្ចប់មិនស្តង់ដា',c:'#BA7517'},
  {zh:'宽窄不一',km:'ទំហំថ្នេរផ្សាខុសគ្នា',c:'#534AB7'},
  {zh:'鱼鳞片间隙',km:'គម្លាតស្រកាត្រី',c:'#185FA5'},
  {zh:'鱼鳞片宽度',km:'ទំហំស្រកាត្រី',c:'#185FA5'},
  {zh:'堆焊',km:'ប៉ោងខ្ពស់ពេក',c:'#0F6E56'},
  {zh:'咬边',km:'ផ្សាស៊ីសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊道重叠',km:'ស្រកាត្រីត្រួតលើគ្នា',c:'#534AB7'},
  {zh:'填充不足',km:'ផ្សាអត់ដល់គ្នា',c:'#0F6E56'},
  {zh:'碰刮伤',km:'ស្នាមដាច់សាច់បំពង់',c:'#E24B4A'},
  {zh:'焊渣',km:'ផ្សាបែកទឹកអន្សា',c:'#BA7517'},
];

/* refs */
const bgImg=document.getElementById('bg-img');
const canvas=document.getElementById('ann-canvas');
const ctx=canvas.getContext('2d');
const hint=document.getElementById('hint');
const deskColor=document.getElementById('desk-color');
const deskSize=document.getElementById('desk-size');
const mobColorInp=document.getElementById('mob-color-inp');
const sheet=document.getElementById('mob-sheet');
const sheetOverlay=document.getElementById('mob-sheet-overlay');
const sheetList=document.getElementById('sheet-list');
const mobSearch=document.getElementById('mob-search');
const deskSearch=document.getElementById('desk-search');
const mobSelBadge=document.getElementById('mob-sel-badge');
const mobSelDot=document.getElementById('mob-sel-dot');
const mobSelText=document.getElementById('mob-sel-text');
const deskDefList=document.getElementById('desk-def-list');
const deskAnnLog=document.getElementById('desk-ann-log');

let mode='circle',selectedDef=null,annotations=[],drawing=false,startX,startY,imgLoaded=false;

function isMob(){return window.innerWidth<=640;}
function getColor(){return isMob()?mobColorInp.value:deskColor.value;}
function getSize(){return parseFloat(deskSize.value);}

/* ── Sheet ── */
function openSheet(){
  sheet.classList.add('open');
  sheetOverlay.classList.add('vis');
  setTimeout(()=>mobSearch.focus(),300);
}
function closeSheet(){
  sheet.classList.remove('open');
  sheetOverlay.classList.remove('vis');
}
document.getElementById('sheet-close').addEventListener('click',closeSheet);
sheetOverlay.addEventListener('click',closeSheet);
document.getElementById('mnav-sheet').addEventListener('click',openSheet);
mobSelBadge.addEventListener('click',openSheet);

/* touch-swipe to close sheet */
let sheetY0=0;
sheet.addEventListener('touchstart',e=>{sheetY0=e.touches[0].clientY;},{passive:true});
sheet.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sheetY0>60)closeSheet();},{passive:true});

/* ── Defect rendering ── */
function norm(s){return s.toLowerCase().replace(/\s/g,'');}
function hlText(t,q){
  if(!q)return t;
  return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>');
}
function scoreMatch(d,q){
  const nq=norm(q),nk=norm(d.km),nz=norm(d.zh);
  if(nk.includes(nq)||nz.includes(nq))return 2;
  let ki=0,zi=0;for(const c of nq){ki=nk.indexOf(c,ki)+1;zi=nz.indexOf(c,zi)+1;}
  return(ki>0||zi>0)?1:0;
}

function renderSheet(q){
  sheetList.innerHTML='';
  const list=DEFECTS.map((d,i)=>({d,i,s:q?scoreMatch(d,q):2})).filter(x=>x.s>0);
  if(!list.length){sheetList.innerHTML='<div class="no-res">រកមិនឃើញ</div>';return;}
  list.forEach(({d,i})=>{
    const el=document.createElement('div');
    el.className='sdef-item'+(selectedDef===d?' sel':'');
    el.dataset.i=i;
    const kH=q?hlText(d.km,q):d.km,zH=q?hlText(d.zh,q):d.zh;
    el.innerHTML=`<div class="sdef-dot" style="background:${d.c}"></div><div><span class="sdef-km">${kH}</span><span class="sdef-zh">${zH}</span></div>`;
    el.addEventListener('click',()=>{selectDef(d);closeSheet();});
    sheetList.appendChild(el);
  });
}

function renderDesk(q){
  deskDefList.innerHTML='';
  const list=DEFECTS.map((d,i)=>({d,i,s:q?scoreMatch(d,q):2})).filter(x=>x.s>0);
  if(!list.length){deskDefList.innerHTML='<div class="no-res">រកមិនឃើញ</div>';return;}
  list.forEach(({d,i})=>{
    const el=document.createElement('div');
    el.className='def-item'+(selectedDef===d?' sel':'');
    el.dataset.i=i;
    const kH=q?hlText(d.km,q):d.km,zH=q?hlText(d.zh,q):d.zh;
    el.innerHTML=`<div class="def-dot" style="background:${d.c}"></div><div style="flex:1;min-width:0"><span class="def-km">${kH}</span><span class="def-zh">${zH}</span></div>`;
    el.addEventListener('click',()=>selectDef(d));
    deskDefList.appendChild(el);
  });
}

function selectDef(d){
  selectedDef=d;
  deskColor.value=d.c; mobColorInp.value=d.c;
  mobSelDot.style.background=d.c;
  mobSelBadge.classList.add('active');
  mobSelText.textContent=d.km;
  document.getElementById('mnav-sheet').classList.add('on');
  renderSheet(mobSearch.value.trim());
  renderDesk(deskSearch.value.trim());
  if(document.getElementById('desk-status'))
    document.getElementById('desk-status').textContent=`ជ្រើស: ${d.km} · ${d.zh}`;
}

mobSearch.addEventListener('input',()=>renderSheet(mobSearch.value.trim()));
mobSearch.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const f=sheetList.querySelector('.sdef-item');if(f){const i=parseInt(f.dataset.i);selectDef(DEFECTS[i]);closeSheet();mobSearch.value='';renderSheet('');}}
  if(e.key==='Escape'){closeSheet();}
});
deskSearch.addEventListener('input',()=>renderDesk(deskSearch.value.trim()));
deskSearch.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const f=deskDefList.querySelector('.def-item');if(f){const i=parseInt(f.dataset.i);selectDef(DEFECTS[i]);deskSearch.value='';renderDesk('');}}
});

renderSheet(''); renderDesk('');

/* ── Mode buttons ── */
function setMode(m){
  mode=m;
  ['c','a','t'].forEach(x=>{
    document.getElementById('btn-'+x)?.classList.toggle('on',m===({c:'circle',a:'arrow',t:'text'}[x]));
    document.getElementById('mnav-'+x)?.classList.toggle('on',m===({c:'circle',a:'arrow',t:'text'}[x]));
  });
  canvas.style.cursor=m==='text'?'text':'crosshair';
}
document.getElementById('btn-c')?.addEventListener('click',()=>setMode('circle'));
document.getElementById('btn-a')?.addEventListener('click',()=>setMode('arrow'));
document.getElementById('btn-t')?.addEventListener('click',()=>setMode('text'));
document.getElementById('mnav-c').addEventListener('click',()=>setMode('circle'));
document.getElementById('mnav-a').addEventListener('click',()=>setMode('arrow'));
document.getElementById('mnav-t').addEventListener('click',()=>setMode('text'));
document.getElementById('mnav-u').addEventListener('click',undoLast);
document.getElementById('btn-u')?.addEventListener('click',undoLast);
document.getElementById('btn-clr')?.addEventListener('click',clearAll);
document.getElementById('mob-save').addEventListener('click',saveImg);
document.getElementById('btn-save-desk')?.addEventListener('click',saveImg);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='c'||e.key==='C')setMode('circle');
  if(e.key==='a'||e.key==='A')setMode('arrow');
  if(e.key==='t'||e.key==='T')setMode('text');
  if(e.key==='z'||e.key==='Z')undoLast();
});

/* ── Image ── */
document.getElementById('file-in').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadImg(f);});
document.addEventListener('paste',e=>{for(const it of(e.clipboardData?.items||[])){if(it.type.startsWith('image/')){loadImg(it.getAsFile());break;}}});
function loadImg(file){
  bgImg.src=URL.createObjectURL(file);bgImg.style.display='block';hint.style.display='none';
  bgImg.onload=()=>{imgLoaded=true;annotations=[];clearLogUI();resizeCanvas();};
}
function resizeCanvas(){
  if(!imgLoaded)return;
  const a=document.getElementById('canvas-area');
  const aW=a.clientWidth,aH=a.clientHeight;
  const sc=Math.min(aW/bgImg.naturalWidth,aH/bgImg.naturalHeight,1);
  const dW=Math.round(bgImg.naturalWidth*sc),dH=Math.round(bgImg.naturalHeight*sc);
  const ox=Math.round((aW-dW)/2),oy=Math.round((aH-dH)/2);
  bgImg.style.cssText=`display:block;position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;transform:none`;
  canvas.width=dW;canvas.height=dH;
  canvas.style.cssText=`position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;cursor:${mode==='text'?'text':'crosshair'}`;
  redraw();
}
window.addEventListener('resize',()=>{if(imgLoaded)resizeCanvas();});

/* ── Canvas events ── */
function getPos(e){const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
canvas.addEventListener('mousemove',e=>{
  const p=getPos(e);
  if(document.getElementById('desk-coord'))document.getElementById('desk-coord').textContent=`${Math.round(p.x)},${Math.round(p.y)}`;
  if(drawing){redraw();drawPreview(startX,startY,p.x,p.y);}
});
canvas.addEventListener('mousedown',e=>{if(!imgLoaded)return;if(mode==='text'){doText(getPos(e));return;}drawing=true;const p=getPos(e);startX=p.x;startY=p.y;});
canvas.addEventListener('mouseup',e=>{if(!drawing)return;drawing=false;const p=getPos(e);if(Math.abs(p.x-startX)<4&&Math.abs(p.y-startY)<4)return;pushAnn(mode,startX,startY,p.x,p.y);});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!imgLoaded||mode==='text')return;drawing=true;const p=getPos(e);startX=p.x;startY=p.y;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);redraw();drawPreview(startX,startY,p.x,p.y);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(!drawing)return;drawing=false;const t=e.changedTouches[0],r=canvas.getBoundingClientRect();pushAnn(mode,startX,startY,t.clientX-r.left,t.clientY-r.top);},{passive:false});
canvas.addEventListener('click',e=>{if(mode==='text'&&imgLoaded)doText(getPos(e));});

function doText(p){if(!selectedDef)return;pushAnn('text',p.x,p.y,p.x,p.y);}
function pushAnn(m,x1,y1,x2,y2){
  if(!selectedDef){if(isMob())openSheet();else document.getElementById('desk-status').textContent='⚠ ជ្រើសប្រភេទបញ្ហាជាមុន!';return;}
  const ann={mode:m,x1,y1,x2,y2,color:getColor(),km:selectedDef.km,zh:selectedDef.zh,n:annotations.length+1};
  annotations.push(ann);redraw();addLogItem(ann);
}

/* ── Drawing ── */
function drawArrow(c,x1,y1,x2,y2,lw){
  const ang=Math.atan2(y2-y1,x2-x1),hL=Math.max(14,lw*5);
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-hL*Math.cos(ang-0.38),y2-hL*Math.sin(ang-0.38));
  c.lineTo(x2-hL*Math.cos(ang+0.38),y2-hL*Math.sin(ang+0.38));
  c.closePath();c.fill();
}
function drawEllipse(c,x1,y1,x2,y2){
  c.beginPath();c.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(Math.abs(x2-x1)/2,2),Math.max(Math.abs(y2-y1)/2,2),0,0,Math.PI*2);c.stroke();
}
function badgeXY(a){return a.mode==='circle'?{x:(a.x1+a.x2)/2,y:Math.min(a.y1,a.y2)}:{x:a.x2,y:a.y2};}
function drawLabel(c,ann,s){
  s=s||1;
  const fsK=Math.round(12*s),fsZ=Math.round(11*s),pad=5*s,gap=3*s,br=9*s;
  const {x:bx,y:by}=badgeXY(ann);
  c.save();
  c.font=`bold ${fsK}px sans-serif`;const wK=c.measureText(ann.km).width;
  c.font=`${fsZ}px sans-serif`;const wZ=c.measureText(ann.zh).width;
  const bW=Math.max(wK,wZ)+pad*2,bH=fsK+gap+fsZ+pad*2;
  const lx=bx+br+4*s,ly=by-bH/2;
  c.fillStyle='rgba(0,0,0,.78)';
  c.beginPath();if(c.roundRect)c.roundRect(lx-pad,ly,bW,bH,4*s);else c.rect(lx-pad,ly,bW,bH);c.fill();
  c.fillStyle=ann.color;c.beginPath();c.arc(bx,by,br,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.font=`bold ${Math.round(9*s)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ann.n,bx,by);
  c.font=`bold ${fsK}px sans-serif`;c.textAlign='left';c.textBaseline='top';c.fillStyle='#fff';c.fillText(ann.km,lx,ly+pad);
  c.font=`${fsZ}px sans-serif`;c.fillStyle='#ffd966';c.fillText(ann.zh,lx,ly+pad+fsK+gap);
  c.restore();
}
function drawCallout(c,ann,s){
  s=s||1;const lw=getSize()*s;
  c.save();c.strokeStyle=ann.color;c.fillStyle=ann.color;c.lineWidth=lw;
  if(ann.mode==='circle')drawEllipse(c,ann.x1,ann.y1,ann.x2,ann.y2);
  else if(ann.mode==='arrow')drawArrow(c,ann.x1,ann.y1,ann.x2,ann.y2,lw);
  c.restore();
  drawLabel(c,ann,s);
}
function drawPreview(x1,y1,x2,y2){
  const lw=getSize();
  ctx.save();ctx.globalAlpha=.6;ctx.strokeStyle=getColor();ctx.fillStyle=getColor();ctx.lineWidth=lw;
  if(mode==='circle')drawEllipse(ctx,x1,y1,x2,y2);
  else if(mode==='arrow')drawArrow(ctx,x1,y1,x2,y2,lw);
  ctx.restore();
}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);annotations.forEach(a=>drawCallout(ctx,a,1));}

/* ── Log ── */
function addLogItem(ann){
  const old=deskAnnLog.querySelector('span');if(old)old.remove();
  const item=document.createElement('div');item.className='log-item';item.dataset.n=ann.n;
  item.innerHTML=`<div class="log-num" style="background:${ann.color}">${ann.n}</div><div class="log-lbl">${ann.km}<br><span class="log-zh">${ann.zh}</span></div><button class="log-del" aria-label="លុប">✕</button>`;
  item.querySelector('.log-del').addEventListener('click',()=>{annotations=annotations.filter(a=>a.n!==ann.n);item.remove();redraw();if(!annotations.length)deskAnnLog.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';});
  deskAnnLog.appendChild(item);deskAnnLog.scrollTop=deskAnnLog.scrollHeight;
}
function clearLogUI(){deskAnnLog.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';}
function undoLast(){if(!annotations.length)return;const l=annotations.pop();const el=deskAnnLog.querySelector(`[data-n="${l.n}"]`);if(el)el.remove();redraw();if(!annotations.length)deskAnnLog.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary)">មិនទាន់មាន...</span>';}
function clearAll(){annotations=[];redraw();clearLogUI();}

/* ── Save ── */
function saveImg(){
  if(!imgLoaded)return;
  const out=document.createElement('canvas');out.width=bgImg.naturalWidth;out.height=bgImg.naturalHeight;
  const oc=out.getContext('2d');oc.drawImage(bgImg,0,0);
  const sx=bgImg.naturalWidth/canvas.width;
  annotations.forEach(ann=>{const sc={...ann,x1:ann.x1*sx,y1:ann.y1*sx,x2:ann.x2*sx,y2:ann.y2*sx};drawCallout(oc,sc,sx);});
  const a=document.createElement('a');a.download='defect_report.png';a.href=out.toDataURL('image/png');a.click();
}
</script>
