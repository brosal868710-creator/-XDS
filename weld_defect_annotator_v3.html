
<style>
*{box-sizing:border-box;margin:0;padding:0}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;height:590px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap}
#sidebar{grid-column:1;grid-row:2/4;overflow-y:auto;border-right:0.5px solid var(--color-border-tertiary);padding:7px;display:flex;flex-direction:column;gap:3px}
#canvas-area{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
#bottombar{grid-column:2;padding:5px 10px;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-secondary)}
#bg-img{object-fit:contain;pointer-events:none;user-select:none;display:none;position:absolute}
#ann-canvas{position:absolute;cursor:crosshair}
#hint{color:#888;font-size:13px;text-align:center;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
#hint i{font-size:40px;color:#555}
.tb-btn{display:flex;align-items:center;gap:4px;padding:5px 9px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.1s}
.tb-btn:hover{background:var(--color-background-secondary)}
.tb-btn.on{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.tb-btn i{font-size:15px}
.tb-sep{width:0.5px;height:22px;background:var(--color-border-tertiary);flex-shrink:0}
.sec-title{font-size:10px;font-weight:500;color:var(--color-text-tertiary);padding:5px 4px 2px;text-transform:uppercase;letter-spacing:.5px}
.def-btn{display:block;width:100%;text-align:left;padding:5px 7px;border:0.5px solid transparent;border-radius:5px;background:none;cursor:pointer;line-height:1.35;transition:all 0.1s}
.def-btn:hover{background:var(--color-background-secondary);border-color:var(--color-border-tertiary)}
.def-btn.sel{background:#E6F1FB;border-color:#378ADD}
.def-btn .km{font-size:11.5px;color:var(--color-text-primary)}
.def-btn.sel .km{color:#0C447C;font-weight:500}
.def-btn .zh{font-size:10px;color:var(--color-text-tertiary)}
.def-btn.sel .zh{color:#185FA5}
#ann-log{display:flex;flex-direction:column;gap:3px}
.log-item{display:flex;align-items:flex-start;gap:6px;padding:4px 6px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px}
.log-num{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#fff;flex-shrink:0;margin-top:1px}
.log-lbl{flex:1;font-size:11px;color:var(--color-text-primary);line-height:1.35}
.log-lbl .lzh{font-size:10px;color:var(--color-text-secondary)}
.log-del{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:12px;padding:0 2px;line-height:1;border-radius:3px;flex-shrink:0}
.log-del:hover{color:#E24B4A}
#color-pick{width:28px;height:26px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:1px;cursor:pointer;background:none}
#size-range{width:65px;accent-color:#378ADD}
label[for=file-in]{cursor:pointer}
#file-in{display:none}
.kbd{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:3px;padding:0 4px;font-size:10px;font-family:var(--font-mono)}
</style>

<div id="app">
  <h2 class="sr-only">ឧបករណ៍គូសសញ្ញាបញ្ហាផ្សា</h2>
  <div id="topbar">
    <label for="file-in" class="tb-btn"><i class="ti ti-photo-up" aria-hidden="true"></i>ចូលរូបភាព</label>
    <input type="file" id="file-in" accept="image/*">
    <div class="tb-sep"></div>
    <button class="tb-btn on" id="btn-c"><i class="ti ti-circle" aria-hidden="true"></i>រង្វង់ <span class="kbd">C</span></button>
    <button class="tb-btn" id="btn-a"><i class="ti ti-arrow-up-right" aria-hidden="true"></i>ព្រួញ <span class="kbd">A</span></button>
    <button class="tb-btn" id="btn-t"><i class="ti ti-text-size" aria-hidden="true"></i>អក្សរ <span class="kbd">T</span></button>
    <div class="tb-sep"></div>
    <input type="color" id="color-pick" value="#FF2222" title="ពណ៌">
    <input type="range" id="size-range" min="1" max="6" value="2.5" step="0.5" title="ទំហំខ្សែ">
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-u"><i class="ti ti-arrow-back-up" aria-hidden="true"></i>Undo <span class="kbd">Z</span></button>
    <button class="tb-btn" id="btn-clr"><i class="ti ti-trash" aria-hidden="true"></i>លុបទាំងអស់</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-save" style="background:#EAF3DE;border-color:#3B6D11;color:#27500A"><i class="ti ti-download" aria-hidden="true"></i>រក្សាទុក</button>
  </div>

  <div id="sidebar">
    <div class="sec-title">ប្រភេទបញ្ហា</div>
    <div id="def-list"></div>
    <div class="sec-title" style="margin-top:6px">ការគូសសញ្ញា</div>
    <div id="ann-log"><span style="font-size:11px;color:var(--color-text-tertiary);padding:2px 4px">មិនទាន់មាន...</span></div>
  </div>

  <div id="canvas-area">
    <div id="hint"><i class="ti ti-photo-plus" aria-hidden="true"></i><span>ចុច «ចូលរូបភាព» ឬ Paste (Ctrl+V)</span></div>
    <img id="bg-img" alt="រូបភាព">
    <canvas id="ann-canvas"></canvas>
  </div>

  <div id="bottombar">
    <i class="ti ti-info-circle" aria-hidden="true"></i>
    <span id="status">ជ្រើសប្រភេទបញ្ហា រួចគូសសញ្ញានៅក្នុងរូបភាព</span>
    <span style="margin-left:auto" id="coord"></span>
  </div>
</div>

<script>
const DEFECTS = [
  {zh:'開裂',km:'ផ្សាប្រេះសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊破',km:'ផ្សាធ្លុះសាច់បំពង់',c:'#E24B4A'},
  {zh:'漏焊',km:'ភ្លេចថ្នេរផ្សា',c:'#BA7517'},
  {zh:'针眼',km:'ភ្នែកម្ជុល',c:'#BA7517'},
  {zh:'凹陷',km:'ស្នាមផត',c:'#BA7517'},
  {zh:'管料搭接偏心',km:'មុខតំណរផ្សាភ្ជាប់មិនស្របគ្នា',c:'#534AB7'},
  {zh:'鱼眼/熔坑',km:'ភ្នែកត្រី',c:'#BA7517'},
  {zh:'电击伤',km:'ផ្សាឆេះម៉ាស់',c:'#E24B4A'},
  {zh:'焊道偏心',km:'ផ្សាខុសវៀច',c:'#534AB7'},
  {zh:'起止点不良',km:'ចំណុចផ្តើម-បញ្ចប់មិនស្តង់ដា',c:'#BA7517'},
  {zh:'宽窄不一',km:'ទំហំថ្នេរផ្សាខុសគ្នា',c:'#534AB7'},
  {zh:'鱼鳞片间隙',km:'គម្លាតស្រកាត្រី',c:'#185FA5'},
  {zh:'鱼鳞片宽度',km:'ទំហំស្រកាត្រី',c:'#185FA5'},
  {zh:'堆焊',km:'ប៉ោងខ្ពស់ពេក',c:'#0F6E56'},
  {zh:'咬边',km:'ផ្សាស៊ីសាច់បំពង់',c:'#E24B4A'},
  {zh:'焊道重叠',km:'ស្រកាត្រីត្រួតលើគ្នា',c:'#534AB7'},
  {zh:'填充不足',km:'ផ្សាអត់ដល់គ្នា',c:'#0F6E56'},
  {zh:'碰刮伤',km:'ស្នាមដាច់សាច់បំពង់',c:'#E24B4A'},
  {zh:'焊渣',km:'ផ្សាបែកទឹកអន្សា',c:'#BA7517'},
];

const defListEl = document.getElementById('def-list');
const annLogEl = document.getElementById('ann-log');
const bgImg = document.getElementById('bg-img');
const canvas = document.getElementById('ann-canvas');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const coordEl = document.getElementById('coord');
const colorPick = document.getElementById('color-pick');
const sizeRange = document.getElementById('size-range');

let mode = 'circle';
let selectedDef = null;
let annotations = [];
let drawing = false;
let startX, startY;
let imgLoaded = false;

// Build defect buttons
DEFECTS.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'def-btn';
  btn.dataset.idx = i;
  btn.innerHTML = `<span class="km">${d.km}</span><span class="zh">${d.zh}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.def-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selectedDef = d;
    colorPick.value = d.c;
    statusEl.textContent = `ជ្រើស: ${d.km} · ${d.zh}`;
  });
  defListEl.appendChild(btn);
});

const btnC = document.getElementById('btn-c');
const btnA = document.getElementById('btn-a');
const btnT = document.getElementById('btn-t');
function setMode(m) {
  mode = m;
  btnC.classList.toggle('on', m==='circle');
  btnA.classList.toggle('on', m==='arrow');
  btnT.classList.toggle('on', m==='text');
  canvas.style.cursor = m==='text' ? 'text' : 'crosshair';
}
btnC.addEventListener('click', () => setMode('circle'));
btnA.addEventListener('click', () => setMode('arrow'));
btnT.addEventListener('click', () => setMode('text'));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key==='c'||e.key==='C') setMode('circle');
  if (e.key==='a'||e.key==='A') setMode('arrow');
  if (e.key==='t'||e.key==='T') setMode('text');
  if (e.key==='z'||e.key==='Z') undoLast();
});

document.getElementById('btn-u').addEventListener('click', undoLast);
document.getElementById('btn-clr').addEventListener('click', () => {
  annotations = [];
  redraw();
  annLogEl.innerHTML = '<span style="font-size:11px;color:var(--color-text-tertiary);padding:2px 4px">មិនទាន់មាន...</span>';
});
document.getElementById('file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return; loadImgFile(f);
});
document.addEventListener('paste', e => {
  for (const item of (e.clipboardData?.items||[])) {
    if (item.type.startsWith('image/')) { loadImgFile(item.getAsFile()); break; }
  }
});

function loadImgFile(file) {
  const url = URL.createObjectURL(file);
  bgImg.src = url;
  bgImg.style.display = 'block';
  hint.style.display = 'none';
  bgImg.onload = () => { imgLoaded=true; annotations=[]; annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary);padding:2px 4px">មិនទាន់មាន...</span>'; resizeCanvas(); };
}

function resizeCanvas() {
  if (!imgLoaded) return;
  const area = document.getElementById('canvas-area');
  const aW = area.clientWidth, aH = area.clientHeight;
  const iW = bgImg.naturalWidth, iH = bgImg.naturalHeight;
  const scale = Math.min(aW/iW, aH/iH, 1);
  const dW = Math.round(iW*scale), dH = Math.round(iH*scale);
  const ox = Math.round((aW-dW)/2), oy = Math.round((aH-dH)/2);
  bgImg.style.cssText = `display:block;position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;transform:none`;
  canvas.width = dW; canvas.height = dH;
  canvas.style.cssText = `position:absolute;left:${ox}px;top:${oy}px;width:${dW}px;height:${dH}px;cursor:crosshair`;
  redraw();
}
window.addEventListener('resize', () => { if(imgLoaded) resizeCanvas(); });

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  return { x: s.clientX-r.left, y: s.clientY-r.top };
}

canvas.addEventListener('mousemove', e => {
  const p = getPos(e);
  coordEl.textContent = `${Math.round(p.x)}, ${Math.round(p.y)}`;
  if (drawing) { redraw(); drawPreview(startX,startY,p.x,p.y); }
});
canvas.addEventListener('mouseleave', () => { coordEl.textContent=''; if(drawing){drawing=false;} });
canvas.addEventListener('mousedown', e => {
  if (!imgLoaded) return;
  if (mode==='text') { handleText(getPos(e)); return; }
  drawing=true; const p=getPos(e); startX=p.x; startY=p.y;
});
canvas.addEventListener('mouseup', e => {
  if (!drawing) return; drawing=false;
  const p=getPos(e);
  if (Math.abs(p.x-startX)<4 && Math.abs(p.y-startY)<4) return;
  pushAnnotation(startX,startY,p.x,p.y);
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); if(!imgLoaded||mode==='text') return; drawing=true; const p=getPos(e); startX=p.x; startY=p.y; }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!drawing) return; const p=getPos(e); redraw(); drawPreview(startX,startY,p.x,p.y); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); if(!drawing) return; drawing=false; const t=e.changedTouches[0]; const r=canvas.getBoundingClientRect(); pushAnnotation(startX,startY,t.clientX-r.left,t.clientY-r.top); }, {passive:false});

function handleText(p) {
  if (!selectedDef) { statusEl.textContent='ជ្រើសប្រភេទបញ្ហាជាមុនសិន!'; return; }
  annotations.push({ mode:'text', x1:p.x, y1:p.y, x2:p.x, y2:p.y, color:colorPick.value, km:selectedDef.km, zh:selectedDef.zh, n:annotations.length+1 });
  redraw(); addLogItem(annotations[annotations.length-1]);
}

function pushAnnotation(x1,y1,x2,y2) {
  if (!selectedDef) { statusEl.textContent='ជ្រើសប្រភេទបញ្ហាជាមុនសិន!'; return; }
  annotations.push({ mode, x1, y1, x2, y2, color:colorPick.value, km:selectedDef.km, zh:selectedDef.zh, n:annotations.length+1 });
  redraw(); addLogItem(annotations[annotations.length-1]);
}

// ── Draw helpers ──────────────────────────────────────────
function drawArrow(c, x1,y1,x2,y2,lw) {
  const ang=Math.atan2(y2-y1,x2-x1), hL=Math.max(14,lw*5);
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  c.beginPath();
  c.moveTo(x2,y2);
  c.lineTo(x2-hL*Math.cos(ang-0.38), y2-hL*Math.sin(ang-0.38));
  c.lineTo(x2-hL*Math.cos(ang+0.38), y2-hL*Math.sin(ang+0.38));
  c.closePath(); c.fill();
}
function drawEllipse(c, x1,y1,x2,y2) {
  const rx=Math.max(Math.abs(x2-x1)/2,2), ry=Math.max(Math.abs(y2-y1)/2,2);
  c.beginPath(); c.ellipse((x1+x2)/2,(y1+y2)/2,rx,ry,0,0,Math.PI*2); c.stroke();
}

// Badge anchor: top-center for circle, tip for arrow, position for text
function badgeAnchor(ann) {
  if (ann.mode==='circle') return { x:(ann.x1+ann.x2)/2, y:Math.min(ann.y1,ann.y2) };
  if (ann.mode==='arrow')  return { x:ann.x2, y:ann.y2 };
  return { x:ann.x1, y:ann.y1 };
}

// Draw bilingual label: number badge + km line + zh line
function drawLabel(c, ann, scale) {
  const s = scale||1;
  const bx = badgeAnchor(ann).x;
  const by = badgeAnchor(ann).y;
  const br = 9*s;
  const fsKm = Math.round(12*s);   // Khmer font size
  const fsZh = Math.round(11*s);   // Chinese font size
  const pad = 5*s;
  const gap = 3*s;

  // Measure both lines
  c.font = `bold ${fsKm}px sans-serif`;
  const wKm = c.measureText(ann.km).width;
  c.font = `${fsZh}px sans-serif`;
  const wZh = c.measureText(ann.zh).width;

  const boxW = Math.max(wKm, wZh) + pad*2;
  const boxH = fsKm + gap + fsZh + pad*2;
  const lbx = bx + br + 4*s;
  const lby = by - boxH/2;

  // Background pill
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.72)';
  c.beginPath();
  if (c.roundRect) c.roundRect(lbx-pad, lby, boxW, boxH, 5*s);
  else { c.rect(lbx-pad, lby, boxW, boxH); }
  c.fill();

  // Number badge circle
  c.fillStyle = ann.color;
  c.beginPath(); c.arc(bx, by, br, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff';
  c.font = `bold ${Math.round(10*s)}px sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(ann.n, bx, by);

  // Khmer line
  c.font = `bold ${fsKm}px sans-serif`;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = '#ffffff';
  c.fillText(ann.km, lbx, lby + pad);

  // Chinese line
  c.font = `${fsZh}px sans-serif`;
  c.fillStyle = '#ffdd88';
  c.fillText(ann.zh, lbx, lby + pad + fsKm + gap);

  c.restore();
}

function drawCallout(c, ann, scale) {
  const lw = parseFloat(sizeRange.value) * (scale||1);
  c.save();
  c.strokeStyle = ann.color; c.fillStyle = ann.color; c.lineWidth = lw;
  if (ann.mode==='circle') drawEllipse(c, ann.x1,ann.y1,ann.x2,ann.y2);
  else if (ann.mode==='arrow') drawArrow(c, ann.x1,ann.y1,ann.x2,ann.y2,lw);
  c.restore();
  drawLabel(c, ann, scale);
}

function drawPreview(x1,y1,x2,y2) {
  const lw = parseFloat(sizeRange.value);
  ctx.save(); ctx.globalAlpha=0.6; ctx.strokeStyle=colorPick.value; ctx.fillStyle=colorPick.value; ctx.lineWidth=lw;
  if (mode==='circle') drawEllipse(ctx,x1,y1,x2,y2);
  else if (mode==='arrow') drawArrow(ctx,x1,y1,x2,y2,lw);
  ctx.restore();
}

function redraw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  annotations.forEach(ann => drawCallout(ctx, ann, 1));
}

function addLogItem(ann) {
  const old = annLogEl.querySelector('span');
  if (old) old.remove();
  const item = document.createElement('div');
  item.className = 'log-item';
  item.dataset.n = ann.n;
  item.innerHTML = `<div class="log-num" style="background:${ann.color}">${ann.n}</div><div class="log-lbl">${ann.km}<br><span class="lzh">${ann.zh}</span></div><button class="log-del" aria-label="លុប">✕</button>`;
  item.querySelector('.log-del').addEventListener('click', () => {
    annotations = annotations.filter(a => a.n !== ann.n);
    item.remove();
    redraw();
    if (!annotations.length) annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary);padding:2px 4px">មិនទាន់មាន...</span>';
  });
  annLogEl.appendChild(item);
  annLogEl.scrollTop = annLogEl.scrollHeight;
}

function undoLast() {
  if (!annotations.length) return;
  const last = annotations.pop();
  const el = annLogEl.querySelector(`[data-n="${last.n}"]`);
  if (el) el.remove();
  redraw();
  if (!annotations.length) annLogEl.innerHTML='<span style="font-size:11px;color:var(--color-text-tertiary);padding:2px 4px">មិនទាន់មាន...</span>';
}

document.getElementById('btn-save').addEventListener('click', () => {
  if (!imgLoaded) return;
  const out = document.createElement('canvas');
  out.width = bgImg.naturalWidth; out.height = bgImg.naturalHeight;
  const oc = out.getContext('2d');
  oc.drawImage(bgImg, 0, 0);
  const sx = bgImg.naturalWidth / canvas.width;
  annotations.forEach(ann => {
    const sc = { ...ann, x1:ann.x1*sx, y1:ann.y1*sx, x2:ann.x2*sx, y2:ann.y2*sx };
    drawCallout(oc, sc, sx);
  });
  const a = document.createElement('a');
  a.download = 'defect_report.png';
  a.href = out.toDataURL('image/png');
  a.click();
});
</script>
